name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI checks code and needs to change nothing on the repository.
permissions:
  contents: read

jobs:
  test:
    # Both, because the agent imports its backend by platform: pywin32 on Windows,
    # python-xlib on Linux. The bridge tests import the agent, so each gets loaded.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            agent/requirements.txt

      - name: Install dependencies
        run: pip install -r server/requirements.txt -r agent/requirements.txt httpx

      - name: Tests
        run: python -m unittest discover tests
